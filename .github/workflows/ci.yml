name: Kotlin Multiplatform E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recursively
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.7.0'
      - name: Verify immutable OptoSync pins
        run: |
          test "$(git -C vendor/opto-sync-clients rev-parse HEAD)" = "$(jq -r .clients opto-sync-pin.json)"
          test "$(git -C vendor/opto-sync-clients/syncer.c rev-parse HEAD)" = "$(jq -r .core opto-sync-pin.json)"
      - name: Test desktop replay and compile browser and Linux targets
        run: |
          gradle --no-daemon desktopTest compileKotlinJs jsBrowserProductionWebpack compileKotlinLinuxX64
          node --check web/service-worker.js
          test -f build/kotlin-webpack/js/productionExecutable/opto-sync-kmp.js

  apple-mobile-desktop:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out recursively
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.7.0'
      - name: Compile macOS and iOS background-worker targets
        run: |
          gradle --no-daemon compileKotlinMacosX64 compileKotlinMacosArm64
          gradle --no-daemon compileKotlinIosArm64 compileKotlinIosSimulatorArm64
